services:
  lingo-agent:
    image: lingo-agent:${LINGO_AGENT_VERSION:-1.3.3}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LINGO_VERSION: ${LINGO_AGENT_VERSION:-1.3.3}
        LINGO_GIT_SHA: ${BUILD_GIT_SHA:-unknown}
    container_name: lingo-agent
    restart: unless-stopped
    env_file: .env
    environment:
      LINGO_VERSION: ${LINGO_AGENT_VERSION:-1.3.3}
      LINGO_GIT_SHA: ${BUILD_GIT_SHA:-unknown}
      PORT: 47081
      HOST: 0.0.0.0
      DATABASE_URL: sqlite:///../data/db.sqlite3
      OUTPUT_DIR: ../data/output
    volumes:
      - lingo_data:/app/data
    # Edge 라우트는 라벨이 아니라 admin 요청으로 만든 edge-infra vhost(nginx/config/conf.d/lingo.conf)가 맡는다.
    # 컨테이너에 edge.* 라벨을 다시 붙이지 않는다(2026-11-11, edge-controller 승인센터 중단).
    networks:
      - shared_ai_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:47081/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  shared_ai_net:
    external: true
    name: ${SHARED_NETWORK_NAME:-shared_ai_net}

volumes:
  lingo_data:
    name: lingo-agent-data
